name: Build and publish manylinux wheels

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

# The workflow only needs to read the repository. Publishing authenticates with
# the TestPyPI token stored in Actions secrets, not with GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: manylinux-wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the release tools
        run: |
          python3 -m pip install --disable-pip-version-check \
            "cibuildwheel==4.2.1" \
            "twine==7.0.0"

      - name: Build and test manylinux wheels
        run: python3 -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64 cp315-manylinux_x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: "bash {package}/manylinux-pre-build-script.sh"
          CIBW_CONFIG_SETTINGS: "--build-option=--use-double --build-option=--use-jack"
          CIBW_ENVIRONMENT_LINUX: "CFLAGS=-I/usr/local/include LDFLAGS=-L/usr/local/lib"
          CIBW_TEST_COMMAND: "python -c \"import pyo; print(pyo.getVersion())\""

      - name: Validate wheel metadata
        run: python3 -m twine check wheelhouse/*.whl

      - name: Upload manylinux wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manylinux-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error
