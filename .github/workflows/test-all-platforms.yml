name: Cross-Platform CI/CD Tests

on:
  push:
    branches: [ master, main, develop, github-actions ]
  pull_request:
    branches: [ master, main, develop, github-actions ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libportaudio2 \
          libportmidi-dev \
          libsndfile1-dev \
          liblo-dev \
          build-essential

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install portaudio portmidi libsndfile liblo

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install pyo pytest pytest-cov

    - name: Run pytest tests
      run: |
        cd tests/pytests
        pytest -v --tb=short --cov=pyo --cov-report=xml || true

    - name: Upload coverage to Codecov
      if: runner.os == 'Linux' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./tests/pytests/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Create test report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results - ${{ matrix.os }} - Python ${{ matrix.python-version }}
        path: 'tests/pytests/.pytest_cache/**/*.xml'
        reporter: 'java-junit'
        fail-on-error: false
